<script>

// ─── GENERAR PDF (FIX UNA SOLA HOJA) ───────────────────────────────
async function generatePDF() {
  const { jsPDF } = window.jspdf;
  const el = document.querySelector('.page');

  // Ocultar footer para captura
  const footer = document.querySelector('.form-footer');
  footer.style.display = 'none';

  const cv = await html2canvas(el, {
    scale: 2,
    useCORS: true,
    backgroundColor: '#fff'
  });

  footer.style.display = '';

  const imgData = cv.toDataURL('image/jpeg', 0.92);

  const pdf = new jsPDF({
    orientation: 'portrait',
    unit: 'mm',
    format: 'a4'
  });

  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();

  const margin = 10;
  const usableW = pageW - margin * 2;
  const usableH = pageH - margin * 2;

  const ratio = cv.width / cv.height;

  // 🔑 ESCALADO PARA QUE ENTRE EN UNA SOLA HOJA
  let imgW = usableW;
  let imgH = usableW / ratio;

  if (imgH > usableH) {
    imgH = usableH;
    imgW = usableH * ratio;
  }

  // 🔑 CENTRADO
  const x = (pageW - imgW) / 2;
  const y = (pageH - imgH) / 2;

  pdf.addImage(imgData, 'JPEG', x, y, imgW, imgH);

  const now = new Date();
  const dd = String(now.getDate()).padStart(2,'0');
  const mm = String(now.getMonth()+1).padStart(2,'0');
  const yyyy = now.getFullYear();
  const hh = String(now.getHours()).padStart(2,'0');
  const min = String(now.getMinutes()).padStart(2,'0');

  const filename = `Vale-AVP-${dd}${mm}${yyyy}-${hh}${min}.pdf`;

  pdf.save(filename);

  return filename;
}
